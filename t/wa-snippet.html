<style id="pcr-wa-css">
.pcr-wa-btn{display:inline-flex;align-items:center;gap:10px;background:#25D366;color:#fff!important;font-weight:700;font-size:16px;padding:12px 20px;border-radius:30px;text-decoration:none!important;box-shadow:0 3px 10px rgba(0,0,0,.18);margin:12px 0 6px}
.pcr-wa-btn:hover{background:#1ebe5b}
.pcr-wa-btn svg{width:22px;height:22px;fill:#fff;flex:none}
.pcr-wa-float{position:fixed;right:20px;bottom:24px;z-index:9999;width:62px;height:62px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.3);animation:pcrwa 2.5s ease-in-out infinite}
.pcr-wa-float svg{width:34px;height:34px;fill:#fff}
.pcr-wa-float span{position:absolute;right:74px;white-space:nowrap;background:#fff;color:#123;font:600 14px/1.2 sans-serif;padding:8px 12px;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.2)}
@keyframes pcrwa{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@media(max-width:767px){.pcr-wa-float{bottom:84px;right:14px;width:56px;height:56px}.pcr-wa-float span{display:none}.pcr-wa-btn{display:flex;justify-content:center}}
